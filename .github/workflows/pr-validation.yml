name: PR Validation

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore backend
        run: dotnet restore Pixelbadger.EnterpriseTicTacToe.slnx

      - name: Build backend
        run: dotnet build Pixelbadger.EnterpriseTicTacToe.slnx --no-restore --configuration Release

      - name: Test backend
        run: dotnet test Pixelbadger.EnterpriseTicTacToe.slnx --no-build --configuration Release

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend
        working-directory: frontend
        run: npm run test -- --run --passWithNoTests
