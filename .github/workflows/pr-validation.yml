name: PR Validation

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test results directories
        run: mkdir -p test-results/backend test-results/frontend

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore backend
        run: dotnet restore Pixelbadger.EnterpriseTicTacToe.slnx

      - name: Build backend
        run: dotnet build Pixelbadger.EnterpriseTicTacToe.slnx --no-restore --configuration Release

      - name: Test backend
        run: dotnet test Pixelbadger.EnterpriseTicTacToe.slnx --no-build --configuration Release --logger trx --results-directory test-results/backend

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend
        working-directory: frontend
        run: npm run test -- --run --reporter=default --reporter=junit --outputFile=../test-results/frontend/vitest.junit.xml

      - name: Publish unit test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            test-results/backend/**/*.trx
            test-results/frontend/**/*.xml

      - name: Upload test result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pr-validation
          path: test-results
          if-no-files-found: warn
