name: CI

on:
  push:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore backend
        run: dotnet restore Pixelbadger.EnterpriseTicTacToe.slnx

      - name: Build backend
        run: dotnet build Pixelbadger.EnterpriseTicTacToe.slnx --no-restore --configuration Release

      - name: Test backend
        run: dotnet test Pixelbadger.EnterpriseTicTacToe.slnx --no-build --configuration Release

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend
        working-directory: frontend
        run: npm run test -- --run --passWithNoTests

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_API_WEBAPP_NAME: ${{ vars.AZURE_API_WEBAPP_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy AppHost
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          CLIENT_IDENTITY_HASH_KEY: ${{ secrets.CLIENT_IDENTITY_HASH_KEY }}
        run: dotnet run --project src/Pixelbadger.EnterpriseTicTacToe.AppHost -- --publisher azure --output-path aspire-output --Azure:SubscriptionId="$AZURE_SUBSCRIPTION_ID" --Azure:ResourceGroup="$AZURE_RESOURCE_GROUP" --Azure:Location="$AZURE_LOCATION" --Parameters:client-identity-hash-key="$CLIENT_IDENTITY_HASH_KEY"

      - name: Run DbUp against deployed database
        run: |
          apiWebAppName="$AZURE_API_WEBAPP_NAME"

          if [ -z "$apiWebAppName" ]; then
            mapfile -t apiWebApps < <(az webapp list --resource-group "$AZURE_RESOURCE_GROUP" --query "[?tags['aspire-resource-name']=='api'].name" -o tsv)

            if [ "${#apiWebApps[@]}" -ne 1 ]; then
              echo "Expected exactly one deployed api web app tagged aspire-resource-name=api in resource group '$AZURE_RESOURCE_GROUP'."
              echo "Set repository variable AZURE_API_WEBAPP_NAME to avoid resource discovery."
              echo "Matched web apps: ${apiWebApps[*]:-<none>}"
              exit 1
            fi

            apiWebAppName="${apiWebApps[0]}"
          fi

          if [ -z "$apiWebAppName" ]; then
            echo "Unable to resolve deployed api web app in resource group '$AZURE_RESOURCE_GROUP'."
            exit 1
          fi

          connectionString="$(az webapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$apiWebAppName" --query "[?name=='ConnectionStrings__DefaultConnection'].value | [0]" -o tsv)"

          if [ -z "$connectionString" ]; then
            echo "Unable to resolve ConnectionStrings__DefaultConnection from '$apiWebAppName'."
            exit 1
          fi

          dotnet run --project src/Pixelbadger.EnterpriseTicTacToe.Database -- --connection-string "$connectionString"
