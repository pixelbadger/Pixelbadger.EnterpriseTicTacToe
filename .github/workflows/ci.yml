name: CI

on:
  push:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test results directories
        run: mkdir -p test-results/backend test-results/frontend

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore backend
        run: dotnet restore Pixelbadger.EnterpriseTicTacToe.slnx

      - name: Build backend
        run: dotnet build Pixelbadger.EnterpriseTicTacToe.slnx --no-restore --configuration Release

      - name: Test backend
        run: dotnet test Pixelbadger.EnterpriseTicTacToe.slnx --no-build --configuration Release --logger trx --results-directory test-results/backend

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend
        working-directory: frontend
        run: npm run test -- --run --reporter=default --reporter=junit --outputFile=../test-results/frontend/vitest.junit.xml

      - name: Publish unit test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            test-results/backend/**/*.trx
            test-results/frontend/**/*.xml

      - name: Upload test result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ci
          path: test-results
          if-no-files-found: warn

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_API_WEBAPP_NAME: ${{ vars.AZURE_API_WEBAPP_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preflight deploy principal RBAC
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$AZURE_RESOURCE_GROUP" ]; then
            echo "::error::AZURE_RESOURCE_GROUP is not set."
            exit 1
          fi

          accessToken="$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)"
          principalObjectId="$(python3 -c 'import base64, json, sys; token = sys.stdin.read().strip(); parts = token.split("."); payload = parts[1] + "=" * (-len(parts[1]) % 4); print(json.loads(base64.urlsafe_b64decode(payload)).get("oid", ""))' <<< "$accessToken")"

          if [ -z "$principalObjectId" ]; then
            echo "::error::Unable to resolve principal object id from the Azure access token."
            exit 1
          fi

          echo "Deploy principal object id: $principalObjectId"

          resourceGroupScope="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP"
          roleNames="$(az role assignment list --assignee-object-id "$principalObjectId" --scope "$resourceGroupScope" --include-inherited --all --query "[].roleDefinitionName" -o tsv)"

          hasOwner=false
          hasContributor=false
          hasUserAccessAdministrator=false

          while IFS= read -r roleName; do
            case "$roleName" in
              Owner)
                hasOwner=true
                ;;
              Contributor)
                hasContributor=true
                ;;
              "User Access Administrator")
                hasUserAccessAdministrator=true
                ;;
            esac
          done <<< "$roleNames"

          if [ "$hasOwner" = true ] || { [ "$hasContributor" = true ] && [ "$hasUserAccessAdministrator" = true ]; }; then
            echo "Deploy principal has sufficient RBAC for resource provisioning and role assignment writes."
            exit 0
          fi

          echo "::error::Deploy principal is missing required RBAC at or above '$resourceGroupScope'."
          echo "::error::Grant Owner, or grant both Contributor and User Access Administrator."
          echo "Resolved role assignments: ${roleNames:-<none>}"
          echo "AZURE_CLIENT_ID: $AZURE_CLIENT_ID"
          exit 1

      - name: Deploy AppHost
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          CLIENT_IDENTITY_HASH_KEY: ${{ secrets.CLIENT_IDENTITY_HASH_KEY }}
        run: |
          set -o pipefail

          deployLogPath="$(mktemp)"
          dotnet run --project src/Pixelbadger.EnterpriseTicTacToe.AppHost -- --publisher azure --output-path aspire-output --Azure:SubscriptionId="$AZURE_SUBSCRIPTION_ID" --Azure:ResourceGroup="$AZURE_RESOURCE_GROUP" --Azure:Location="$AZURE_LOCATION" --Parameters:client-identity-hash-key="$CLIENT_IDENTITY_HASH_KEY" 2>&1 | tee "$deployLogPath"

          if grep -Eq "Pipeline execution failed|Step 'provision-.*' failed|InvalidTemplateDeployment|Microsoft\.Authorization/roleAssignments/write" "$deployLogPath"; then
            echo "::error::AppHost publish reported Azure provisioning errors. Ensure the GitHub OIDC principal has permissions to create role assignments (for example Contributor + User Access Administrator) at the deployment scope."
            exit 1
          fi

      - name: Run DbUp against deployed database
        env:
          AZURE_SQL_MIGRATION_CONNECTION_STRING: ${{ secrets.AZURE_SQL_MIGRATION_CONNECTION_STRING }}
        run: |
          set -o pipefail

          connectionString="$AZURE_SQL_MIGRATION_CONNECTION_STRING"

          if [ -z "$connectionString" ]; then
            apiWebAppName="$AZURE_API_WEBAPP_NAME"

            if [ -z "$apiWebAppName" ]; then
              mapfile -t apiWebApps < <(az webapp list --resource-group "$AZURE_RESOURCE_GROUP" --query "[?tags['aspire-resource-name']=='api'].name" -o tsv)

              if [ "${#apiWebApps[@]}" -ne 1 ]; then
                echo "Expected exactly one deployed api web app tagged aspire-resource-name=api in resource group '$AZURE_RESOURCE_GROUP'."
                echo "Set repository variable AZURE_API_WEBAPP_NAME to avoid resource discovery."
                echo "Matched web apps: ${apiWebApps[*]:-<none>}"
                exit 1
              fi

              apiWebAppName="${apiWebApps[0]}"
            fi

            if [ -z "$apiWebAppName" ]; then
              echo "Unable to resolve deployed api web app in resource group '$AZURE_RESOURCE_GROUP'."
              exit 1
            fi

            connectionString="$(az webapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$apiWebAppName" --query "[?name=='ConnectionStrings__DefaultConnection'].value | [0]" -o tsv)"
          fi

          if [ -z "$connectionString" ]; then
            echo "Unable to resolve a migration connection string."
            echo "Set secret AZURE_SQL_MIGRATION_CONNECTION_STRING, or ensure ConnectionStrings__DefaultConnection is set on the deployed api app."
            exit 1
          fi

          if [[ "$connectionString" == *"Authentication=ActiveDirectoryDefault"* ]]; then
            echo "Using ActiveDirectoryDefault authentication for DbUp."
            echo "Ensure the GitHub OIDC principal has a SQL database user with migration permissions, or provide AZURE_SQL_MIGRATION_CONNECTION_STRING for migration-specific credentials."
          fi

          dbupLogPath="$(mktemp)"
          set +e
          dotnet run --project src/Pixelbadger.EnterpriseTicTacToe.Database -- --connection-string "$connectionString" 2>&1 | tee "$dbupLogPath"
          dbupExitCode=${PIPESTATUS[0]}
          set -e

          if [ "$dbupExitCode" -ne 0 ]; then
            if grep -q "Login failed for user '<token-identified principal>'" "$dbupLogPath"; then
              echo "::error::DbUp could not authenticate to Azure SQL as the OIDC token principal. Provision SQL access for the principal, or set AZURE_SQL_MIGRATION_CONNECTION_STRING to SQL credentials intended for migrations."
            fi

            exit "$dbupExitCode"
          fi
